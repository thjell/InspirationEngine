<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Spin The Wheel - create account</title>
        <link rel="icon" href="images/wheel_clean_ui.png">

        <!-- Fonts and CSS--> 
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles/app.css" />

        <!-- Connected scripts--> 
        <script type="module" src="components/header.js"></script>
        <script type="module" src="authState.js"></script>
        <script type="module" src="components/footer.js"></script>

    </head>

    <!-- Specifying the name of the body--> 
    <body class="bodycenter"> 

        <!-- Placeholder for header component --> 
        <app-header></app-header>

        <!-- Starting main content--> 
        <main>
            <h1>Create account</h1>

            <!-- Form for creating a new user account -->
            <form id="createUserForm" class="user-form filter-card">
                <!-- Input field for email -->
                <label for="email">Email:
                    <input type="text" id="email" name="email" placeholder="hello@example.com" required>
                </label>
                <!-- Input field for password -->
                <label for="password">Password:
                    <input type="password" id="password" name="password" required>
                </label>
                <!-- Input field for repeating password -->
                <label for="password-repeat">Repeat password:
                    <input type="password" id="password-repeat" name="password-repeat" required>
                </label>
                <!-- Submit button for creating account -->
                <button type="submit" name="create-account" id="create-account">Create account</button>
                <!-- Link to login page -->
                <span>Already have an account? <a href="login.html">Log in</a></span>
            </form>
            
            <!-- Connected user controller -->
            <script type="module" src="controller/userController.js"></script>
        </main>

        <!-- Placeholder for footer component --> 
        <app-footer></app-footer>

        <!-- Placeholder for modal component --> 
        <app-modal></app-modal>

    </body>
</html>
