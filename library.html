<!DOCTYPE html>
<html lang="en">


<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library</title>
  <link rel="icon" href="images/wheel_clean_ui.png">

  <!-- Fonts and CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles/app.css" />

  <!-- Connected scripts -->
  <script type="module" src="components/header.js"></script>
  <script type="module" src="authState.js"></script>
  <script type="module" src="components/movieInfoModal.js"></script>
  
</head>


<body>

<!--DOM elements for modals-->
<app-modal></app-modal>
<movie-info-modal></movie-info-modal>

<!--DOM element for header--> 
<app-header title="Library"></app-header>


  <main>


    <!--Section for searching movies and displaying search results from TMDB -->
    <section id="movies">
      <div class="search-container">

        <input
          type="text"
          id="movie-search"
          placeholder="Search for movie from TMDB..."
        >
      </div>

      <div class="movie-list"></div>
      
<!-- Drag and drop popcorn -->  
      <div
        id="popcorn-dropzone"
        class="popcorn-dropzone"
        title="Drag movie here and save for later in MyList"
      >
        <img src="images/dragAndDropPopCorn4.png" alt="Save to My Movies">
        <span></span>
      </div>
    </section>
  
  </main>

  
  <!-- footer -->
  <script src="components/footer.js"></script>
  <app-footer></app-footer>

  <!-- libraryController -->
  <script type="module" src="controller/libraryController.js"></script>


</body>

</html>
