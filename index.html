<!-- This is the HTML file for the Spin The Wheel and is the main entry point for the application -->
 <!--Written by Sander -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spin The Wheel</title>
    <link rel="icon" href="images/wheel_clean_ui.png">

    <!-- Fonts and CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/app.css" />

    <!-- Connected scripts -->
    <script type="module" src="components/header.js"></script>
    <script type="module" src="authState.js"></script>
    <script type="module" src="components/movieInfoModal.js"></script>
</head>

<body>
    <!--Curtains for opening animation-->
    <div class="curtain curtain-left open"></div>
     <div class="curtain curtain-right open"></div>

    <!--Linker til header--> 
    <app-header title="Spin the wheel!"></app-header>

    <!-- Main Content -->
    <main class="home-layout">

    <!-- Left Panel -->
    <section class="left-panel">
        <p class="instruction-text">Select your preferences,<br />THEN spin the wheel!</p>
    
    <div class="filter-card">
        <h2>Genre</h2>
        <select id="genreSelect" class="custom-dropdown">
            <option value="Comedy" selected>Comedy</option>
            <option value="Action">Action</option>
            <option value="Drama">Drama</option>
            <option value="Adventure">Adventure</option>
            <option value="Documentary">Documentary</option> 
            <option value="Fantasy">Fantasy</option>
            <option value="Science Fiction">Science Fiction</option>
            <option value="Crime">Crime</option>
            <option value="Romance">Romance</option>
            <option value="Thriller">Thriller</option>
            <option value="Horror">Horror</option>
        </select>
    </div>

<div class="filter-card">
    <h2>Company</h2>
        <select id="companySelect" class="custom-dropdown">
            <option value="Alone">Alone</option>
            <option value="Friends">Friends</option>
            <option value="Family">Family</option>
            <option value="Partner" selected>Partner</option>
        </select>
</div>

<div class="filter-card filter-card-wide">
    <h2>Age</h2>
        <select id="ageSelect" class="custom-dropdown">
            <option value="0+">0+</option>
            <option value="7+">7+</option>
            <option value="12+">12+</option> 
            <option value="16+">16+</option>
        </select>
    </div>
</section>

    <!--Right Panel With Wheel-->
    <section class="right-panel">
        <div class="wheel-section">
            <div class="wheel-wrapper">
            <div class="pointer"></div>
            <div id="wheel" class="wheel"></div>
            </div>
        <button id="spinButton" class="spin-button">Spin The Wheel</button>
        </div>
    </section>
</main>

    <script type="module" src="controller/wheelController.js"></script>
    <script src="components/footer.js"></script>
    <app-footer></app-footer>

    <!-- Movie Modal -->
    <div id="movieModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2 class="modal-title">Stop Scrolling And Start Watching!</h2>

        <div class="poster-container">
            <div class="popcorn-decor left">
                <span class="popcorn p1">🍿</span>
                <span class="popcorn p2">🍿</span>
                <span class="popcorn p3">🍿</span>
            </div>

            <div id="modalPoster" class="movie-poster">
                <p>FILMPLAKAT</p>
            </div>

            <div class="popcorn-decor right">
                <span class="popcorn p4">🍿</span>
                <span class="popcorn p5">🍿</span>
            </div>
        </div>
        
        <div id="modalResult" class="modal-movie-name">Movie Title</div>


        <button id="closeModalBtn" class="option-btn active">Spin Again</button>
        <button id="inviteFriendBtn" class="option-btn secondary">Invite friend ✉️</button>

            <div id="inviteForm" class="invite-form" style="display:none; margin-top: 15px;">
            <input
            type="email"
            id="friendEmail"
            placeholder="Friend's email"
            class="invite-input"
            />
            <button id="sendInviteBtn" class="option-btn active">Send invite</button>
            <p id="inviteStatus"></p>
            </div>
    </div>
</div>

    <!-- Modal Components -->
    <app-modal></app-modal>
    <movie-info-modal></movie-info-modal>

</body>
</html>
