<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Spin The Wheel - sign in</title>
        <link rel="icon" href="images/wheel_clean_ui.png">

        <!-- Fonts and CSS--> 
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles/app.css" />

        <!-- Connected scripts--> 
        <script type="module" src="components/header.js"></script>
        <script type="module" src="authState.js"></script>
        <script type="module" src="components/footer.js"></script>
    </head>

    <!-- Specifying the name of the body--> 
    <body class="bodycenter">

        <!-- Placeholder for header component --> 
        <app-header></app-header>

        <!-- Starting main content--> 
        <main>
            <h1>Log in</h1>
            <!-- Login form for existing users-->
            <form id="loginForm" class="user-form filter-card">

                <!-- Input field for email--> 
                <label for="email">Email:
                    <input type="text" id="email" name="email" placeholder="hello@example.com">
                </label>
                <!-- Input field for password--> 
                <label for="password">Password:
                    <input type="password" id="password" name="password">
                </label>
                <!-- Submit button for signing in--> 
                <button type="submit" name="sign-in" id="sign-in" class="button" >Log in</button>
                <!-- Link to create new account--> 
                <a href="createaccount.html">Create new account</a>
            </form>

        <!-- Connected user controller--> 
        <script type="module" src="controller/userController.js"></script>
        </main> 

        <!-- Placeholder for footer component --> 
        <app-footer></app-footer>

        <!-- Placeholder for modal component --> 
        <app-modal></app-modal>
        
    </body>
</html>
